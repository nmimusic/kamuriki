search --set=root --file /%DISTRO_UNAME%

insmod all_video

set default="0"
set timeout=30

menuentry "Install %DISTRO_NAME%" {
   linux /live/vmlinuz boot=live nopersistent nomodeset quiet splash locales=ja_JP.UTF-8 keyboard-layouts=jp timezone=Asia/Tokyo ---
   initrd /live/initrd
}

menuentry "Install %DISTRO_NAME% (Copy to RAM)" {
   linux /live/vmlinuz boot=live nopersistent nomodeset toram quiet splash locales=ja_JP.UTF-8 keyboard-layouts=jp timezone=Asia/Tokyo ---
   initrd /live/initrd
}

menuentry "Check disc for defects" {
   linux /live/vmlinuz boot=live integrity-check quiet splash ---
   initrd /live/initrd
}
